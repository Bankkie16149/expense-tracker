name: CD Pipeline (Deploy Backend)

on:
  workflow_dispatch: # ปิดโหมดอัตโนมัติ เปลี่ยนเป็นกดปุ่ม Deploy ด้วยตัวเองเผื่ออนาคต

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Connect and Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # เปลี่ยน path ให้ตรงกับที่เก็บโปรเจกต์บน Server
            cd /home/tanakorn/expense-tracker/backend
            
            echo "📥 Pulling latest code..."
            git pull origin main
            
            echo "📦 Installing dependencies..."
            npm install
            
            echo "🗄️ Updating database schema..."
            npx prisma generate
            npx prisma migrate deploy
            
            echo "🔄 Restarting application..."
            pm2 restart expense-backend
            
            echo "✅ Deployment successful!"
